services:
  postgresql:
    container_name: bankie-postgres
    image: docker.io/bitnami/postgresql:latest
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgresql_data:/bitnami/postgresql
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_SHARED_BUFFERS=128MB
      - POSTGRESQL_WORK_MEM=32MB
      - POSTGRESQL_MAINTENANCE_WORK_MEM=64MB
      - POSTGRESQL_EFFECTIVE_CACHE_SIZE=512MB
      - POSTGRESQL_MAX_CONNECTIONS=100
      - POSTGRESQL_FSYNC=off
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bankie-net

  redis:
    container_name: bankie-redis
    image: bitnami/redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bankie-net

  migrations:
    container_name: bankie-migrations
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      - DB_USER=bankie_app
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - DB_HOST=bankie-postgres
      - DB_PORT=5432
      - DB_NAME=bankie_main
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[migrations] Initializing database user and schema..."

        # Create user if not exists
        PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -tc \
          "SELECT 1 FROM pg_roles WHERE rolname='bankie_app'" | grep -q 1 || \
          PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -c \
          "CREATE USER bankie_app WITH ENCRYPTED PASSWORD '$${DB_PASSWD}'; ALTER ROLE bankie_app WITH CREATEDB;"

        # Create database if not exists (each statement separate — CREATE DATABASE cannot run in a transaction)
        PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname='bankie_main'" | grep -q 1 || \
          { PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -c "CREATE DATABASE bankie_main;" && \
            PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE bankie_main TO bankie_app;" && \
            PGPASSWORD= psql -h bankie-postgres -p 5432 -U postgres -c "ALTER DATABASE bankie_main OWNER TO bankie_app;"; }

        echo "[migrations] Running migrations..."
        DATABASE_URL="postgres://bankie_app:$${DB_PASSWD}@bankie-postgres:5432/bankie_main" /app/migrations

        echo "[migrations] Done."
    networks:
      - bankie-net

  bankie:
    container_name: bankie
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    ports:
      - '${APP_PORT:-3030}:3030'
    environment:
      - ENV=docker
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - JWT_SECRET=${JWT_SECRET:-LocalDevSecretKey1234567890abcdefghijklmnop}
      - RUST_LOG=${RUST_LOG:-info}
      - SQLX_OFFLINE=true
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - bankie-net

  bankie-gateway:
    container_name: bankie-gateway
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    ports:
      - '${GATEWAY_PORT:-4040}:4040'
    environment:
      - ENV=docker
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - JWT_SECRET=${JWT_SECRET:-LocalDevSecretKey1234567890abcdefghijklmnop}
      - CORE_URL=http://bankie:3030
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      bankie:
        condition: service_started
    restart: unless-stopped
    networks:
      - bankie-net

  portal-spa:
    container_name: portal-spa
    build:
      context: ./portal-spa
      dockerfile: Dockerfile
    ports:
      - '${PORTAL_PORT:-8080}:80'
    depends_on:
      - bankie-gateway
    restart: unless-stopped
    networks:
      - bankie-net

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bankie-net:
    driver: bridge
