services:
  postgresql:
    container_name: bankie-postgres
    image: docker.io/bitnami/postgresql:16
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgresql_data:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localpostgres}
      - POSTGRESQL_SHARED_BUFFERS=128MB
      - POSTGRESQL_WORK_MEM=32MB
      - POSTGRESQL_MAINTENANCE_WORK_MEM=64MB
      - POSTGRESQL_EFFECTIVE_CACHE_SIZE=512MB
      - POSTGRESQL_MAX_CONNECTIONS=100
      - POSTGRESQL_FSYNC=off
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bankie-net

  redis:
    container_name: bankie-redis
    image: bitnami/redis:7.2
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localredispass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/bitnami/redis/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bankie-net

  migrations:
    container_name: bankie-migrations
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localpostgres}
      - DB_USER=bankie_app
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - DB_HOST=bankie-postgres
      - DB_PORT=5432
      - DB_NAME=bankie_main
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[migrations] Initializing database user and schema..."

        # Create user if not exists
        PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -tc \
          "SELECT 1 FROM pg_roles WHERE rolname='bankie_app'" | grep -q 1 || \
          PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -c \
          "CREATE USER bankie_app WITH ENCRYPTED PASSWORD '$${DB_PASSWD}'; ALTER ROLE bankie_app WITH CREATEDB;"

        # Create database if not exists (each statement separate — CREATE DATABASE cannot run in a transaction)
        PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname='bankie_main'" | grep -q 1 || \
          { PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -c "CREATE DATABASE bankie_main;" && \
            PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE bankie_main TO bankie_app;" && \
            PGPASSWORD=$${POSTGRES_PASSWORD:-localpostgres} psql -h bankie-postgres -p 5432 -U postgres -c "ALTER DATABASE bankie_main OWNER TO bankie_app;"; }

        echo "[migrations] Running migrations..."
        DATABASE_URL="postgres://bankie_app:$${DB_PASSWD}@bankie-postgres:5432/bankie_main" /app/migrations

        echo "[migrations] Done."
    networks:
      - bankie-net

  bankie:
    container_name: bankie
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    ports:
      - '${APP_PORT:-3030}:3030'
    environment:
      - ENV=docker
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - JWT_SECRET=${JWT_SECRET:-LocalDevSecretKey1234567890abcdefghijklmnop}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localredispass}
      - RUST_LOG=${RUST_LOG:-info}
      - SQLX_OFFLINE=true
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 8.8.4.4
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:3030/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bankie-net

  bankie-gateway:
    container_name: bankie-gateway
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    ports:
      - '${GATEWAY_PORT:-4040}:4040'
    environment:
      - ENV=docker
      - DB_PASSWD=${DB_PASSWD:-localpass}
      - JWT_SECRET=${JWT_SECRET:-LocalDevSecretKey1234567890abcdefghijklmnop}
      - CORE_URL=http://bankie:3030
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localredispass}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      bankie:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:4040/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bankie-net

  portal-spa:
    container_name: portal-spa
    build:
      context: ./portal-spa
      dockerfile: Dockerfile
    ports:
      - '${PORTAL_PORT:-8080}:80'
    depends_on:
      bankie-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16M
      - /var/cache/nginx:size=32M
      - /run:size=8M
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - bankie-net

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bankie-net:
    driver: bridge
